[package]
name    = "txwatch-rules"
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true
description = "Alert rule evaluation and payload construction for TxWatch"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Enables decoding of Soroban envelope_xdr / result_xdr via the stellar-xdr crate.
soroban-xdr = ["dep:stellar-xdr"]

[dependencies]
txwatch-config = { path = "../config", version = "0.1.0" }
serde          = { workspace = true }
serde_json     = { workspace = true }
anyhow         = { workspace = true }
chrono         = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
proptest   = "1"
serde_json = { workspace = true }
sha2           = { workspace = true }
hex            = { workspace = true }
stellar-xdr    = { version = "21", optional = true, default-features = false, features = ["std", "curr"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "evaluate"
harness = false
