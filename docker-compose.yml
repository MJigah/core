services:
  txwatch:
    build: .
    container_name: txwatch-dev
    volumes:
      - ./config/docker-compose.toml:/config/txwatch.toml:ro
    environment:
      RUST_LOG: debug
      TXWATCH_CONFIG: /config/txwatch.toml
    command: watch
    depends_on:
      - webhook
    networks:
      - txwatch

  webhook:
    image: mendhak/http-https-echo:latest
    container_name: webhook-echo
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
    networks:
      - txwatch

networks:
  txwatch:
    driver: bridge
